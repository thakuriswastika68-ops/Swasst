<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DD Clues – Data Analysis Tool</title>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      padding: 20px;
    }
    h1, h2 {
      color: #222;
    }
    section {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #eee;
    }
    button {
      padding: 8px 14px;
      margin: 6px 0;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .link-btn {
      background: #28a745;
    }
  </style>
</head>

<body>

<h1>🔍 DD Clues – CSV Data Analysis Tool</h1>

<!-- Chat History Button -->
<button class="link-btn"
  onclick="window.open('https://chatgpt.com/share/69376ee0-5d90-8007-aeb9-21070a74b5d8','_blank')">
  📎 View DD Analysis Chat History
</button>

<section>
  <h2>1️⃣ Upload CSV</h2>
  <input type="file" id="fileInput" accept=".csv" />
</section>

<section>
  <h2>2️⃣ Data Preview</h2>
  <div id="preview"></div>
</section>

<section>
  <h2>3️⃣ Descriptive Statistics</h2>
  <div id="stats"></div>
</section>

<section>
  <h2>4️⃣ Unique Counts (Categorical)</h2>
  <div id="unique"></div>
</section>

<section>
  <h2>5️⃣ Anomaly Detection (IQR)</h2>
  <button onclick="detectAnomalies()">Find Anomalies</button>
  <div id="anomalies"></div>
</section>

<section>
  <h2>6️⃣ Visualization</h2>
  <select id="chartColumn"></select>
  <button onclick="drawHistogram()">Histogram</button>
  <canvas id="chart"></canvas>
</section>

<section>
  <h2>7️⃣ Export Data</h2>
  <button onclick="exportData()">Download Anomalies CSV</button>
</section>

<script>
let data = [];
let headers = [];

document.getElementById("fileInput").addEventListener("change", function(e) {
  Papa.parse(e.target.files[0], {
    header: true,
    dynamicTyping: true,
    complete: function(results) {
      data = results.data;
      headers = results.meta.fields;
      previewData();
      showStats();
      showUniqueCounts();
      populateChartColumns();
    }
  });
});

function previewData() {
  renderTable(data.slice(0, 20), "preview");
}

function renderTable(rows, elementId) {
  let html = "<table><tr>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";
  rows.forEach(row => {
    html += "<tr>";
    headers.forEach(h => html += `<td>${row[h]}</td>`);
    html += "</tr>";
  });
  html += "</table>";
  document.getElementById(elementId).innerHTML = html;
}

function showStats() {
  let html = "<table><tr><th>Column</th><th>Mean</th><th>Min</th><th>Max</th></tr>";
  headers.forEach(col => {
    let nums = data.map(r => r[col]).filter(v => typeof v === "number");
    if (nums.length > 0) {
      const mean = nums.reduce((a,b)=>a+b,0)/nums.length;
      html += `<tr><td>${col}</td><td>${mean.toFixed(2)}</td>
              <td>${Math.min(...nums)}</td><td>${Math.max(...nums)}</td></tr>`;
    }
  });
  html += "</table>";
  document.getElementById("stats").innerHTML = html;
}

function showUniqueCounts() {
  let html = "<table><tr><th>Column</th><th>Unique Values</th></tr>";
  headers.forEach(col => {
    let uniques = new Set(data.map(r => r[col]));
    html += `<tr><td>${col}</td><td>${uniques.size}</td></tr>`;
  });
  html += "</table>";
  document.getElementById("unique").innerHTML = html;
}

function detectAnomalies() {
  let col = headers.find(h => typeof data[0][h] === "number");
  let nums = data.map(r => r[col]).filter(v => typeof v === "number").sort((a,b)=>a-b);
  let q1 = nums[Math.floor(nums.length * 0.25)];
  let q3 = nums[Math.floor(nums.length * 0.75)];
  let iqr = q3 - q1;

  let anomalies = data.filter(r => r[col] < q1 - 1.5*iqr || r[col] > q3 + 1.5*iqr);
  window.anomalies = anomalies;
  renderTable(anomalies.slice(0, 20), "anomalies");
}

function populateChartColumns() {
  let select = document.getElementById("chartColumn");
  headers.forEach(h => select.innerHTML += `<option>${h}</option>`);
}

function drawHistogram() {
  let col = document.getElementById("chartColumn").value;
  let nums = data.map(r => r[col]).filter(v => typeof v === "number");

  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: nums,
      datasets: [{
        label: col,
        data: nums
      }]
    }
  });
}

function exportData() {
  let csv = Papa.unparse(window.anomalies || []);
  let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "anomalies.csv";
  link.click();
}
</script>

</body>
</html>
